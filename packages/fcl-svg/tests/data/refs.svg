<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="60" height="40">
  <defs>
    <clipPath id="half">
      <rect x="0" y="0" width="10" height="20"/>
    </clipPath>
    <clipPath id="corners">
      <rect x="22" y="0" width="8" height="8"/>
      <rect x="26" y="4" width="8" height="8"/>
    </clipPath>
    <mask id="fade" maskUnits="userSpaceOnUse"
          x="0" y="0" width="60" height="40">
      <rect x="0" y="20" width="20" height="10" fill="#ffffff"/>
      <rect x="0" y="30" width="20" height="10" fill="#808080"/>
    </mask>
    <pattern id="dots" patternUnits="userSpaceOnUse"
             x="40" y="0" width="8" height="8">
      <rect x="0" y="0" width="4" height="4" fill="#0000ff"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="20" height="20" fill="red" clip-path="url(#half)"/>
  <rect x="22" y="0" width="12" height="12" fill="green"
        clip-path="url(#corners)"/>
  <rect x="0" y="20" width="20" height="20" fill="black" mask="url(#fade)"/>
  <rect x="40" y="0" width="16" height="16" fill="url(#dots)"/>
  <svg x="40" y="20" width="10" height="10">
    <rect x="0" y="0" width="30" height="30" fill="#ff00ff"/>
  </svg>
</svg>

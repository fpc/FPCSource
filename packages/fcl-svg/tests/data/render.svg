<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="100" viewBox="0 0 100 50">
  <title>Render walk</title>
  <style>
    .accent { fill: #0000ff; }
  </style>
  <defs>
    <linearGradient id="ramp">
      <stop offset="0" stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <g id="pair">
      <rect x="0" y="0" width="10" height="10" class="accent"/>
      <circle cx="16" cy="5" r="4"/>
    </g>
    <symbol id="badge" viewBox="0 0 10 10">
      <rect x="0" y="0" width="10" height="10" fill="green"/>
    </symbol>
  </defs>
  <rect x="1" y="1" width="20" height="20" fill="red"
        stroke="black" stroke-width="2"/>
  <g transform="translate(30,0)" opacity="0.5">
    <use xlink:href="#pair" x="2" y="3"/>
  </g>
  <use xlink:href="#badge" x="60" y="10" width="20" height="20"/>
  <ellipse cx="90" cy="40" rx="8" ry="5" fill="url(#ramp)"/>
  <switch>
    <g requiredExtensions="http://example.com/ext">
      <rect x="0" y="40" width="5" height="5" fill="yellow"/>
    </g>
    <rect x="0" y="40" width="5" height="5" fill="lime"/>
  </switch>
  <rect x="50" y="40" width="5" height="5" display="none"/>
  <rect x="56" y="40" width="5" height="5" visibility="hidden"/>
</svg>

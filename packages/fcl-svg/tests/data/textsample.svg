<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="460" viewBox="0 0 640 460">
  <defs>
    <path id="curve" d="M 40 430 C 160 370 340 370 460 430"/>
  </defs>
  <rect width="640" height="460" fill="#ffffff"/>

  <text x="20" y="34" font-family="serif" font-size="26">serif Hamburgefons</text>
  <text x="20" y="70" font-family="sans-serif" font-size="26">sans Hamburgefons</text>
  <text x="20" y="106" font-family="monospace" font-size="26">mono Hamburgefons</text>

  <text x="20" y="146" font-family="sans-serif" font-size="22"
        font-weight="bold">bold</text>
  <text x="110" y="146" font-family="sans-serif" font-size="22"
        font-style="italic">italic</text>
  <text x="200" y="146" font-family="sans-serif" font-size="22"
        font-weight="bold" font-style="italic">both</text>
  <text x="290" y="146" font-family="sans-serif" font-size="22"
        font-weight="100">thin</text>
  <text x="370" y="146" font-family="NoSuchFamily, serif" font-size="22">fallback</text>

  <text x="20" y="184" font-family="serif" font-size="22"
        text-decoration="underline">underlined</text>
  <text x="180" y="184" font-family="serif" font-size="22"
        text-decoration="line-through">struck</text>
  <text x="300" y="184" font-family="serif" font-size="22"
        letter-spacing="4">spaced out</text>

  <line x1="320" y1="200" x2="320" y2="240" stroke="#c0c0c0"/>
  <text x="320" y="222" font-family="sans-serif" font-size="20"
        text-anchor="middle">centred on the line</text>
  <line x1="620" y1="240" x2="620" y2="276" stroke="#c0c0c0"/>
  <text x="620" y="262" font-family="sans-serif" font-size="20"
        text-anchor="end">ending on the line</text>

  <text x="20" y="300" font-family="sans-serif" font-size="22">
    é Ж 日 中 א ا
  </text>

  <text x="20" y="338" font-family="sans-serif" font-size="20"
        textLength="260" lengthAdjust="spacingAndGlyphs">stretched to 260</text>

  <text x="320" y="338" font-family="serif" font-size="20">
    <tspan fill="#b00000">red </tspan><tspan dy="-8">up </tspan><tspan dy="8"
    rotate="20">turned</tspan>
  </text>

  <text font-family="sans-serif" font-size="20" writing-mode="tb"
        x="590" y="300">
    <tspan>tategaki</tspan>
  </text>

  <text font-family="serif" font-size="22" fill="#00408a">
    <textPath xlink:href="#curve">text laid along a curve it follows</textPath>
  </text>
</svg>

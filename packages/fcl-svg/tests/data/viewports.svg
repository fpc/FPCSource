<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <rect x="0" y="0" width="100%" height="10%" fill="green"/>
  <svg x="10" y="10" width="40" height="40" viewBox="0 0 20 20">
    <rect x="0" y="0" width="20" height="20" fill="red"/>
  </svg>
  <svg x="50" y="50" width="40" height="20" viewBox="0 0 10 10"
       preserveAspectRatio="xMinYMin meet">
    <rect x="0" y="0" width="10" height="10" fill="blue"/>
  </svg>
  <svg x="0" y="80" width="20" height="20">
    <rect x="0" y="0" width="50%" height="50%" fill="black"/>
  </svg>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="120" height="80" viewBox="0 0 120 80">
  <title>Motion animation</title>
  <defs>
    <path id="arc" d="M 10 10 C 40 10 80 10 110 10"/>
  </defs>
  <rect x="-5" y="-5" width="10" height="10" fill="#ff0000">
    <animateMotion dur="2s" rotate="auto" fill="freeze">
      <mpath xlink:href="#arc"/>
    </animateMotion>
  </rect>
  <rect x="-4" y="-4" width="8" height="8" fill="#0000ff"
        transform="skewX(30)">
    <animateMotion values="10,40; 10,60; 60,60" dur="2s" fill="freeze"/>
  </rect>
  <rect x="80" y="30" width="20" height="20" fill="#008000">
    <animate attributeName="width" values="20;60" dur="2s"
             calcMode="spline" keySplines="0 1 0 1" fill="freeze"/>
  </rect>
</svg>

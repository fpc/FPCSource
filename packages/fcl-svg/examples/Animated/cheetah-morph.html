<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheetah morph</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1a1a1a;
  --dim: #666666;
  --line: #d6d6d6;
  --panel: #f6f6f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161616;
    --fg: #ececec;
    --dim: #9a9a9a;
    --line: #333333;
    --panel: #1f1f1f;
  }
}
body {
  margin: 0;
  padding: 2rem 1.5rem 3rem;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 system-ui, sans-serif;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  margin: 0 0 .25rem;
}
p.lead {
  margin: 0 0 2rem;
  color: var(--dim);
  max-width: 62ch;
}
.pair {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
}
figure {
  flex: 1 1 320px;
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 1rem;
}
figure img, figure object {
  display: block;
  width: 100%;
  height: auto;
  max-width: 512px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 4px;
}
figcaption {
  margin-top: .85rem;
  color: var(--dim);
  font-size: .9rem;
}
figcaption b {
  display: block;
  color: var(--fg);
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: .2rem;
}
code {
  font-family: ui-monospace, monospace;
  font-size: .85em;
}
footer {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  color: var(--dim);
  font-size: .9rem;
  max-width: 62ch;
}
</style>
</head>
<body>
<h1>Lazarus to Free Pascal to Fresnel</h1>
<p class="lead">Source is  SVG morphing the three cheetah logos into
one another, drawn twice: once by the browser from the document, once by
fcl-svg as a GIF.</p>

<div class="pair">
  <figure>
    <object type="image/svg+xml" data="cheetah-morph.svg" width="512" height="512">
      <img src="cheetah-morph.svg" alt="The morph as an SVG">
    </object>
    <figcaption>
      <b>cheetah-morph.svg</b>
      The SVG. Played by the browser.
    </figcaption>
  </figure>
  <figure>
    <img src="cheetah-morph.gif" alt="The morph as a GIF">
    <figcaption>
      <b>cheetah-morph.gif</b>
      GIF generated from the SVG, generated by <code>svgsmil.pp</code>.
    </figcaption>
  </figure>
</div>

</body>
</html>

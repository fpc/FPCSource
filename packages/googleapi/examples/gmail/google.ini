; Sample configuration for gmaildemo.
; Replace the client ID and secret with those of your own OAuth client,
; or import them with: gmaildemo -j client_secret_XXXX.json
[Application]
client_id=123456789012-abcdefghijklmnopqrstuvwxyz012345.apps.googleusercontent.com
client_secret=GOCSPX-replace-with-your-client-secret
redirect_uri=http://127.0.0.1:8085
access_type=atOffline

[Provider]
AuthURL=https://accounts.google.com/o/oauth2/auth
TokenURL=https://oauth2.googleapis.com/token
AuthScope=https://www.googleapis.com/auth/gmail.readonly

; Tokens of session "me", written by the demo after you grant access.
; Remove this section to force a new consent.
[session_me]
access_token=
refresh_token=
token_type=
expires_in=0
expires_at=

; Sample configuration for calendardemo.
; Replace the client ID and secret with those of your own OAuth client,
; or import them with: calendardemo -j client_secret_XXXX.json
[Application]
client_id=XXX
client_secret=secret
redirect_uri=http://127.0.0.1:8085
access_type=atOffline

[Provider]
AuthURL=https://accounts.google.com/o/oauth2/auth
TokenURL=https://oauth2.googleapis.com/token
AuthScope=https://www.googleapis.com/auth/calendar

; Tokens of session "me", written by the demo after you grant access.
; Remove this section to force a new consent.
[session_me]
access_token=
refresh_token=
token_type=
expires_in=0
expires_at=
